<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="styleesheet" href="/src/style.css" />
    <title>Painel de Despesas</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h2 id="sidebarTitulo" class="sidebar__titulo">Resumo</h2>

        <p class="sidebar__rotulo-total">Soma total</p>
        <p id="somaTotalDespesas" class="sidebar__valor-total">R$ 0,00</p>

        <hr class="sidebar__divisor" />

        <p class="sidebar__rotulo-categorias">Totais por categoria</p>
        <ul id="totaisPorCategoria" class="sidebar__lista-categorias"></ul>
      </aside>

      <main id="conteudo">
        <section id="cardNovaDespesa" class="card">
          <h2 class="card__titulo">Nova Despesa</h2>

          <form id="formNovaDespesa" class="form-nova-despesa" novalidate>
            <div class="campo">
              <label for="tituloDespesa">Título</label>
              <input
                type="text"
                id="tituloDespesa"
                name="titulo"
                placeholder="Ex.: Mercado do mês"
              />
            </div>

            <div class="campo">
              <label for="valorDespesa">Valor</label>
              <input
                type="number"
                id="valorDespesa"
                name="valor"
                placeholder="Ex.: 150,00"
                step="0.01"
                min="0.01"
              />
            </div>

            <div class="campo">
              <label for="categoriaDespesa">Categoria</label>
              <select id="categoriaDespesa" name="categoria">
                <option value="" disabled selected>Selecione uma categoria</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Transporte">Transporte</option>
                <option value="Lazer">Lazer</option>
                <option value="Saude">Saúde</option>
                <option value="Cartao">Cartão de Crédito</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <button type="submit" id="botaoAdicionarDespesa" class="botao-adicionar">
              Adicionar despesa
            </button>
          </form>

          <p id="mensagemErroValidacao" class="mensagem-erro" hidden></p>
        </section>

        <section id="cardListaDespesas" class="card">
          <h2 class="card__titulo">Despesas</h2>

          <ul id="listaDespesas" class="lista-despesas"></ul>

          <p id="mensagemListaVazia" class="mensagem-vazia">
            Nenhuma despesa cadastrada ainda.
          </p>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
